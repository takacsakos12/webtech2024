services:
  mongo:
    image: mongo:7.0.16
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          'quit(db.adminCommand({ping:1}).ok ? 0 : 1)',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  mongo-data:
