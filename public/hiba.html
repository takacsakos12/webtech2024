<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Magyar Fight Shop – felszerelések boxhoz, MMA-hoz és harcművészetekhez."
    />
    <title>Sikertelen művelet · Magyar Fight Shop</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js" defer></script>
  </head>
  <body data-page="message">
    <a class="skip-link" href="#main">Ugrás a tartalomra</a>
    <header class="site-header">
      <nav class="nav wrap" aria-label="Fő navigáció">
        <a class="brand" href="/"
          >MF<span class="brand-mark">/</span>SHOP<span class="brand-sub"
            >MAGYAR FIGHT SHOP</span
          ></a
        >
        <div class="nav-links">
          <a href="/webshop.html">Felszerelések</a
          ><a href="/login.html" data-guest>Bejelentkezés</a
          ><a href="/register.html" data-guest>Regisztráció</a
          ><a href="/cart.html" data-auth hidden
            >Kosár <span class="badge" id="cart-count">0</span></a
          ><span id="username" data-auth hidden></span
          ><button class="link-button" id="logout" data-auth hidden>
            Kijelentkezés
          </button>
        </div>
      </nav>
    </header>
    <main id="main">
      <section class="wrap message-page">
        <h1>Sikertelen művelet</h1>
        <p>A művelet nem sikerült. Jelentkezz be, és próbáld újra.</p>
        <a class="button" href="/webshop.html">Tovább a webshopba →</a>
      </section>
    </main>
    <footer class="site-footer wrap">
      <a class="brand" href="/">MF<span class="brand-mark">/</span>SHOP</a>
      <p>Küzdősport. Felszerelés. Elszántság.</p>
      <small
        >Oktatási bemutatóprojekt · Valós fizetés és kiszállítás nélkül.</small
      >
    </footer>
    <div
      class="notification"
      id="notification"
      role="status"
      aria-live="polite"
      hidden
    ></div>
  </body>
</html>
